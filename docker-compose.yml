services:
  db:
    build: .
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - .:/workspace  # Mounts your local folder to /workspace in the container
    # After `make && make install` inside the container, enable preload and restart:
    command: postgres -c shared_preload_libraries='pg_otel_trace'