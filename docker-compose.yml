services:
  db:
    build: .
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - .:/workspace 
      # Mount the init script to run during database creation
      - ./scripts/01-enable-extension.sh:/docker-entrypoint-initdb.d/01-enable-extension.sh

  jaeger:
    image: jaegertracing/all-in-one:1.58
    command: ["--collector.otlp.enabled=true"]
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP HTTP receiver